<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل ادمین - کلیپ مذهبی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    color: #fff;
    min-height: 100vh;
  }

  /* هدر */
  .admin-header {
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(15px);
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(212,175,55,0.3);
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .admin-header .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .admin-header .logo-icon {
    font-size: 1.8rem;
    filter: drop-shadow(0 0 10px #d4af37);
  }
  .admin-header h1 {
    font-size: 1.2rem;
    color: #d4af37;
    font-weight: 800;
  }
  .admin-header p { font-size: 0.75rem; color: #888; }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  .btn-header {
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.3s;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-view {
    background: rgba(0,212,255,0.15);
    color: #00d4ff;
    border: 1px solid rgba(0,212,255,0.4);
  }
  .btn-view:hover { background: #00d4ff; color: #000; }

  .btn-logout {
    background: rgba(255,71,87,0.15);
    color: #ff4757;
    border: 1px solid rgba(255,71,87,0.4);
  }
  .btn-logout:hover { background: #ff4757; color: #fff; }

  /* کانتینر */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px;
  }

  /* کارت آمار */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: rgba(255,255,255,0.04);
    padding: 20px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 15px;
  }
  .stat-icon {
    font-size: 2rem;
    width: 55px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: rgba(0,212,255,0.1);
  }
  .stat-info h3 {
    font-size: 1.6rem;
    color: #00d4ff;
    font-weight: 800;
  }
  .stat-info p { font-size: 0.8rem; color: #888; margin-top: 4px; }

  /* سکشن‌ها */
  .section {
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 25px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    font-size: 1.1rem;
    color: #d4af37;
    font-weight: 700;
  }
  .section-title::before {
    content: '';
    width: 4px;
    height: 20px;
    background: #d4af37;
    border-radius: 2px;
  }

  /* فرم */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .form-grid .full { grid-column: 1/-1; }

  label {
    display: block;
    margin-bottom: 8px;
    color: #bbb;
    font-size: 0.85rem;
    font-weight: 600;
  }

  input[type="text"],
  input[type="url"],
  input[type="password"],
  textarea,
  select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(0,0,0,0.25);
    color: #fff;
    font-family: inherit;
    font-size: 0.92rem;
    transition: all 0.3s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #d4af37;
    box-shadow: 0 0 0 3px rgba(212,175,55,0.1);
  }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: #1a1a2e; }

  .hint {
    font-size: 0.75rem;
    color: #666;
    margin-top: 6px;
    display: block;
  }

  .btn-primary {
    background: linear-gradient(90deg, #d4af37, #f0c850);
    color: #111;
    border: none;
    padding: 13px 30px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    transition: all 0.3s;
    margin-top: 15px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(212,175,55,0.3);
  }
  .btn-primary:disabled { opacity: 0.6; cursor: wait; }

  /* لیست ویدیوها */
  .video-list-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    margin-bottom: 10px;
    border: 1px solid rgba(255,255,255,0.05);
    transition: all 0.3s;
  }
  .video-list-item:hover {
    border-color: rgba(212,175,55,0.3);
    background: rgba(0,0,0,0.3);
  }

  .video-thumb {
    width: 60px;
    height: 60px;
    border-radius: 10px;
    background: rgba(212,175,55,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
  }

  .video-info-list { flex: 1; min-width: 0; }
  .video-info-list h4 {
    font-size: 0.95rem;
    color: #eee;
    margin-bottom: 5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .video-info-list small {
    font-size: 0.75rem;
    color: #888;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .btn-delete {
    background: rgba(255,71,87,0.15);
    color: #ff4757;
    border: 1px solid rgba(255,71,87,0.4);
    padding: 8px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.3s;
    flex-shrink: 0;
  }
  .btn-delete:hover { background: #ff4757; color: #fff; }

  .empty-list {
    text-align: center;
    padding: 40px;
    color: #666;
    font-size: 0.9rem;
  }

  /* صفحه لاگین */
  .login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(212,175,55,0.3);
    padding: 40px;
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .login-icon {
    font-size: 4rem;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 20px #d4af37);
  }
  .login-box h1 {
    color: #d4af37;
    font-size: 1.5rem;
    margin-bottom: 8px;
  }
  .login-box p {
    color: #888;
    font-size: 0.85rem;
    margin-bottom: 30px;
  }
  .login-box input {
    margin-bottom: 12px;
    text-align: right;
  }
  .login-box .btn-primary {
    width: 100%;
    justify-content: center;
    margin-top: 8px;
  }
  .login-error {
    background: rgba(255,71,87,0.15);
    color: #ff4757;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 15px;
    display: none;
  }

  /* لودینگ */
  .loading {
    display: flex;
    justify-content: center;
    padding: 40px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(212,175,55,0.2);
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* توست */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translate(-50%, 150px);
    background: #00ffa3;
    color: #000;
    padding: 14px 25px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    transition: transform 0.3s;
    z-index: 300;
    box-shadow: 0 10px 30px rgba(0,255,163,0.3);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast.error {
    background: #ff4757;
    color: #fff;
    box-shadow: 0 10px 30px rgba(255,71,87,0.3);
  }

  /* موبایل */
  @media (max-width: 600px) {
    .container { padding: 15px; }
    .form-grid { grid-template-columns: 1fr; }
    .admin-header { padding: 15px; }
    .admin-header h1 { font-size: 1rem; }
    .header-actions { gap: 6px; }
    .btn-header { padding: 6px 12px; font-size: 0.75rem; }
    .section { padding: 18px; }
    .video-list-item { padding: 12px; }
    .video-thumb { width: 45px; height: 45px; font-size: 1.3rem; }
  }
</style>
</head>
<body>

<!-- ========== صفحه لاگین ========== -->
<div id="loginPage" class="login-wrapper">
  <div class="login-box">
    <div class="login-icon">🕌</div>
    <h1>پنل مدیریت</h1>
    <p>کلیپ مذهبی</p>

    <div class="login-error" id="loginError"></div>

    <input type="password" id="password" placeholder="🔑 رمز عبور" autocomplete="current-password" />

    <button class="btn-primary" onclick="login()" id="loginBtn" style="width:100%;justify-content:center;">
      🔐 ورود به پنل
    </button>
  </div>
</div>

<!-- ========== پنل ادمین ========== -->
<div id="adminPage" style="display:none;">
  <header class="admin-header">
    <div class="logo">
      <div class="logo-icon">🕌</div>
      <div>
        <h1>پنل مدیریت</h1>
        <p>کلیپ مذهبی</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn-header btn-view" target="_blank">👁 مشاهده سایت</a>
      <button class="btn-header btn-logout" onclick="logout()">🚪 خروج</button>
    </div>
  </header>

  <div class="container">

    <!-- آمار -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">🎬</div>
        <div class="stat-info">
          <h3 id="totalVideos">0</h3>
          <p>کل ویدیوها</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔴</div>
        <div class="stat-info">
          <h3 id="aparatCount">0</h3>
          <p>آپارات</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">▶️</div>
        <div class="stat-info">
          <h3 id="youtubeCount">0</h3>
          <p>یوتیوب</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👤</div>
        <div class="stat-info">
          <h3 style="font-size:1rem;color:#d4af37;">ادمین</h3>
          <p>خوش آمدی</p>
        </div>
      </div>
    </div>

    <!-- فرم افزودن -->
    <section class="section">
      <h2 class="section-title">➕ افزودن ویدیو جدید</h2>
      <form id="addForm" onsubmit="addVideo(event)">
        <div class="form-grid">
          <div class="full">
            <label>عنوان ویدیو *</label>
            <input type="text" id="videoTitle" required placeholder="مثلاً: زیارت عاشورا" />
          </div>

          <div>
            <label>پلتفرم *</label>
            <select id="platform" required>
              <option value="aparat">🔴 آپارات</option>
              <option value="youtube">▶️ یوتیوب</option>
              <option value="mp4">🎬 فایل MP4</option>
            </select>
          </div>

          <div>
            <label>لینک ویدیو *</label>
            <input type="url" id="videoUrl" required placeholder="https://www.aparat.com/v/xxxxx" />
            <span class="hint" id="urlHint">مثال: https://www.aparat.com/v/abc123</span>
          </div>

          <div class="full">
            <label>توضیحات (اختیاری)</label>
            <textarea id="videoDesc" placeholder="توضیح کوتاه درباره ویدیو..."></textarea>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          ➕ افزودن ویدیو
        </button>
      </form>
    </section>

    <!-- لیست ویدیوها -->
    <section class="section">
      <h2 class="section-title">🎬 لیست ویدیوهای موجود</h2>
      <div id="videoList">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </section>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ========= تنظیمات =========
  const SUPABASE_URL = 'https://ndumhscrbnoxbswzlnnv.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kdW1oc2NyYm5veGJzd3psbm52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjk4MzIsImV4cCI6MjEwNzY0NTgzMn0.opc7Psn093phcZSm5YgipukRLP6afiNDFG3KsOqPi8o';

  // ========= رمز عبور ادمین =========
  const ADMIN_PASSWORD = 'amirali';
  // =================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ======== استخراج ID ========
  function extractVideoId(url, platform) {
    try {
      if (platform === 'youtube') {
        if (url.includes('youtube.com/watch')) return new URL(url).searchParams.get('v');
        if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split(/[?&]/)[0];
        if (url.includes('/embed/')) return url.split('/embed/')[1].split(/[?&]/)[0];
        if (url.includes('/shorts/')) return url.split('/shorts/')[1].split(/[?&]/)[0];
      }
      if (platform === 'aparat') {
        if (url.includes('aparat.com/v/')) return url.split('/v/')[1].split(/[/?#]/)[0];
        if (url.includes('videohash/')) return url.split('videohash/')[1].split(/[/?#]/)[0];
      }
    } catch (e) { return null; }
    return null;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast', 3000);
  }

  // ======== ورود ========
  function login() {
    const password = document.getElementById('password').value;
    const errorBox = document.getElementById('loginError');
    errorBox.style.display = 'none';

    if (!password) {
      errorBox.textContent = 'رمز عبور را وارد کنید';
      errorBox.style.display = 'block';
      return;
    }

    if (password !== ADMIN_PASSWORD) {
      errorBox.textContent = '❌ رمز عبور اشتباه است';
      errorBox.style.display = 'block';
      document.getElementById('password').value = '';
      return;
    }

    sessionStorage.setItem('admin_logged_in', 'true');
    showToast('خوش آمدی ادمین ✨');
    showAdmin();
  }

  // ======== خروج ========
  function logout() {
    if (!confirm('از پنل خارج می‌شوی؟')) return;
    sessionStorage.removeItem('admin_logged_in');
    document.getElementById('adminPage').style.display = 'none';
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('password').value = '';
    showToast('خارج شدی');
  }

  // ======== نمایش پنل ========
  function showAdmin() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('adminPage').style.display = 'block';
    loadVideos();
  }

  // ======== افزودن ویدیو ========
  async function addVideo(e) {
    e.preventDefault();

    const title = document.getElementById('videoTitle').value.trim();
    const url = document.getElementById('videoUrl').value.trim();
    const platform = document.getElementById('platform').value;
    const desc = document.getElementById('videoDesc').value.trim();
    const btn = document.getElementById('submitBtn');

    if (platform !== 'mp4' && !extractVideoId(url, platform)) {
      return showToast('لینک نامعتبر است، دوباره چک کن', true);
    }

    btn.disabled = true;
    btn.textContent = '⏳ در حال ذخیره...';

    const { error } = await sb.from('videos').insert({
      title, description: desc, video_url: url, platform
    });

    btn.disabled = false;
    btn.textContent = '➕ افزودن ویدیو';

    if (error) {
      return showToast('خطا: ' + error.message, true);
    }

    showToast('ویدیو با موفقیت اضافه شد ✅');
    document.getElementById('addForm').reset();
    document.getElementById('urlHint').textContent = 'مثال: https://www.aparat.com/v/abc123';
    loadVideos();
  }

  // ======== بارگذاری لیست ========
  async function loadVideos() {
    const list = document.getElementById('videoList');
    const { data, error } = await sb
      .from('videos')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      list.innerHTML = `<div class="empty-list">خطا: ${error.message}</div>`;
      return;
    }

    document.getElementById('totalVideos').textContent = data.length;
    document.getElementById('aparatCount').textContent = data.filter(v => v.platform === 'aparat').length;
    document.getElementById('youtubeCount').textContent = data.filter(v => v.platform === 'youtube').length;

    if (!data || data.length === 0) {
      list.innerHTML = `<div class="empty-list">📭 هنوز ویدیویی اضافه نکردی</div>`;
      return;
    }

    const icons = { aparat: '🔴', youtube: '▶️', mp4: '🎬' };
    const names = { aparat: 'آپارات', youtube: 'یوتیوب', mp4: 'MP4' };

    list.innerHTML = data.map(v => `
      <div class="video-list-item">
        <div class="video-thumb">${icons[v.platform] || '🎬'}</div>
        <div class="video-info-list">
          <h4>${escapeHtml(v.title)}</h4>
          <small>${names[v.platform]} • ${new Date(v.created_at).toLocaleDateString('fa-IR')}</small>
        </div>
        <button class="btn-delete" onclick="deleteVideo(${v.id}, '${escapeHtml(v.title)}')">
          🗑 حذف
        </button>
      </div>
    `).join('');
  }

  // ======== حذف ========
  async function deleteVideo(id, title) {
    if (!confirm(`مطمئنی می‌خوای "${title}" رو حذف کنی؟`)) return;

    const { error } = await sb.from('videos').delete().eq('id', id);

    if (error) return showToast('خطا: ' + error.message, true);

    showToast('حذف شد 🗑️');
    loadVideos();
  }

  // ======== تغییر hint ========
  document.getElementById('platform').addEventListener('change', (e) => {
    const hints = {
      aparat: 'مثال: https://www.aparat.com/v/abc123',
      youtube: 'مثال: https://www.youtube.com/watch?v=xxxxx یا https://youtu.be/xxxxx',
      mp4: 'لینک مستقیم: https://example.com/video.mp4'
    };
    document.getElementById('urlHint').textContent = hints[e.target.value];
  });

  // ======== Enter برای لاگین ========
  document.getElementById('password').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') login();
  });

  // ======== شروع ========
  (function init() {
    if (sessionStorage.getItem('admin_logged_in') === 'true') {
      showAdmin();
    } else {
      document.getElementById('loginPage').style.display = 'flex';
    }
  })();
</script>
</body>
</html>
